<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Interview - CareerForge AI</title>
  <meta name="description" content="Configure and launch your personalized technical mock assessment.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .config-card {
      max-width: 600px;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="navAvatar">U</div>
        <span class="sidebar-logo">CareerForge AI</span>
      </div>
      
      <ul class="sidebar-menu">
        <li>
          <a href="dashboard.html" class="sidebar-link">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="resume.html" class="sidebar-link">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Resume Parser
          </a>
        </li>
        <li>
          <a href="#" class="sidebar-link active">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            AI Interview
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="page-header">
        <div class="page-title">
          <h2>Configure AI Interview</h2>
          <p>Configure evaluation metrics and launch session assessments.</p>
        </div>
        <div class="user-profile-badge">
          <div class="avatar" id="badgeAvatar">S</div>
          <span id="badgeName">User</span>
          <span class="badge badge-student">Student</span>
        </div>
      </header>

      <!-- Alert Banner -->
      <div id="alertBanner" class="alert-banner"></div>

      <!-- Candidate Resume Summary Card -->
      <div id="resumeSummaryCard" class="glass-card config-card" style="margin-bottom: 1.5rem; padding: 1.2rem; display: none;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem;">
          <h4 style="margin: 0; color: var(--accent-primary); display: flex; align-items: center; gap: 0.5rem; font-size: 1.05rem;">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Uploaded Resume: <span id="resumeFileName" style="color: var(--text-primary); font-weight: 600;">Loading...</span>
          </h4>
          <span id="resumeVerifiedBadge" class="badge badge-success">Verified</span>
        </div>
        <div id="resumeProjectsBadge" style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.6rem; background: var(--bg-tertiary); padding: 0.6rem 0.8rem; border-radius: 6px;">
          Checking resume projects...
        </div>
      </div>

      <!-- Config Box -->
      <section class="glass-card config-card">
        <h3 style="margin-bottom: 2rem; color: var(--accent-primary); border-bottom: 1px solid var(--border-light); padding-bottom: 0.5rem; text-align: center;">
          Mock Session Parameters
        </h3>

        <form id="setupForm">
          <!-- Interview Type -->
          <div class="form-group">
            <label for="type" class="form-label">Interview Type</label>
            <select id="type" class="form-input" required>
              <option value="Mixed">Mixed (Technical + Project-based)</option>
              <option value="Technical">Technical Only (Core fundamentals & languages)</option>
              <option value="Project-based">Project-based Only (System architecture & implementation)</option>
            </select>
          </div>

          <!-- Difficulty -->
          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="difficulty" class="form-label">Difficulty Settings</label>
            <select id="difficulty" class="form-input" required>
              <option value="Adaptive">Adaptive (Difficulty adapts to answer accuracy)</option>
              <option value="Easy">Easy (Focuses on basics and syntaxes)</option>
              <option value="Medium">Medium (Tests standard implementation & concepts)</option>
              <option value="Hard">Hard (Tests complex edge cases & optimizations)</option>
            </select>
          </div>

          <!-- Question Count -->
          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="questionCount" class="form-label">Total Questions</label>
            <select id="questionCount" class="form-input" required>
              <option value="10">10 Questions (Standard mock evaluation)</option>
              <option value="15">15 Questions (Thorough evaluation)</option>
              <option value="20">20 Questions (Extended assessment)</option>
            </select>
          </div>

          <!-- Mode -->
          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="mode" class="form-label">Interview Mode</label>
            <select id="mode" class="form-input" required>
              <option value="Text">Written Text Mode</option>
              <option value="Voice">Interactive Voice Mode (TTS / STT)</option>
            </select>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary" id="startBtn" style="margin-top: 2.5rem; padding: 1rem; font-size: 1.1rem;">
            Launch Assessment Session
          </button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/auth.js?v=25"></script>
  <script src="js/interview-setup.js?v=25"></script>
</body>
</html>
