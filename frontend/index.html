<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerForge AI - Welcome</title>
  <meta name="description" content="Welcome page of CareerForge AI redirecting to appropriate dashboard or sign-in space.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .welcome-card {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .welcome-logo {
      font-size: 2.8rem;
      background: linear-gradient(135deg, #fff 30%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="glass-card welcome-card">
      <div class="welcome-logo">CareerForge AI</div>
      <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">
        Academic Management & Session Auditing Control
      </p>
      
      <div id="redirectingMsg" style="display: none; color: var(--accent-primary); font-weight: 500;">
        Verifying active session...
      </div>
      
      <div id="actionButtons">
        <a href="signin.html" class="btn btn-primary" style="margin-bottom: 1rem; display: flex;">Sign In</a>
        <a href="signup.html" class="btn btn-secondary" style="display: flex;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js?v=25"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');
      
      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          document.getElementById('actionButtons').style.display = 'none';
          document.getElementById('redirectingMsg').style.display = 'block';
          
          setTimeout(() => {
            redirectBasedOnRole(user);
          }, 800);
        } catch (e) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
        }
      }
    });
  </script>
</body>
</html>
